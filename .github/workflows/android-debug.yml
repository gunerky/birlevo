name: Android development checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Repository and localization checks
        run: |
          python3 tools/repository/check_repository.py
          python3 tools/localization/generate.py --check
          python3 -m unittest discover -s tools/jev -p test_review.py
          python3 -m unittest discover -s tools/pptx -p 'test_*.py'
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          python3 -m unittest discover -s tools/licensing -p 'test_*.py'
      - name: Verify pinned native SDK tools
        run: python3 tools/ci/prepare_android_sdk.py
      - name: Debug build, unit tests and lint
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Exact commercial runtime license coverage
        run: |
          bash gradlew --no-daemon :app:exportRuntimeLicenseInventory
          python3 tools/licensing/audit_runtime.py --check
          python3 tools/testing/verify_mp3_artifact.py app/build/outputs/apk/debug/app-debug.apk
      - name: Development tool isolation
        run: python3 tools/jev/review.py guard --artifact app/build/outputs/apk/debug/app-debug.apk
